<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datom</title>
    <link rel="stylesheet" href="css/draggable.css">
    <!-- inline, so there is no favicon.ico request to 404 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%233b6fff'/><rect x='7' y='7' width='8' height='8' rx='1.5' fill='white'/><rect x='17' y='7' width='8' height='8' rx='1.5' fill='white' opacity='.55'/><rect x='7' y='17' width='18' height='8' rx='1.5' fill='white' opacity='.8'/></svg>">
  </head>
  <body>
    <header class="datom-header">
      <strong class="datom-brand">datom</strong>
      <button class="custom-input" type="button" id="btn-new-layout">New layout</button>
      <button class="custom-input" type="button" id="btn-save-layout">Save layout</button>
      <label class="visually-hidden" for="file-select">Saved layout</label>
      <select class="custom-input" id="file-select">
        <option value="null_option">Empty layout</option>
      </select>
      <span class="datom-hint">click the grid to add a box</span>
    </header>

    <main id="datom-grid-container"></main>

    <dialog id="editorModal">
      <div class="editor-bar">
        <div class="lang_icons" role="group" aria-label="Language">
          <button class="lang_icon" type="button" data-lang="html" aria-pressed="true">HTML</button>
          <button class="lang_icon" type="button" data-lang="js" aria-pressed="false">JS</button>
          <button class="lang_icon" type="button" data-lang="css" aria-pressed="false">CSS</button>
          <button class="lang_icon" type="button" data-lang="q" aria-pressed="false">Q</button>
        </div>
        <span class="editor-target" id="editor-target"></span>
        <span class="datom-hint">⌘S / Ctrl-S to apply</span>
        <button class="custom-input" type="button" id="btn-close-editor">Close</button>
      </div>
      <div id="editorHost"></div>
    </dialog>

    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.5/src-min-noconflict/ace.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ace-builds@1.36.5/src-min-noconflict/ext-language_tools.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts@3.54.1"></script>
    <script src="js/boxes.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/draggable.js"></script>
    <script src="js/grid.js"></script>
    <script src="js/configure_datom.js"></script>
  </body>
</html>
